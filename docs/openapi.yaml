components:
  schemas:
    AuthorView:
      additionalProperties: false
      properties:
        avatar_url:
          type: string
        display_name:
          type: string
        username:
          type: string
      required:
        - username
        - display_name
      type: object
    CardListOutputBody:
      additionalProperties: false
      properties:
        data:
          items:
            $ref: "#/components/schemas/View"
          type: array
      required:
        - data
      type: object
    CheckDTO:
      additionalProperties: false
      properties:
        name:
          description: Dependency name
          examples:
            - postgres
          type: string
        ok:
          description: Whether the dependency answered
          type: boolean
      required:
        - name
        - ok
      type: object
    Chip:
      additionalProperties: false
      properties:
        color_key:
          description: Palette key; nil means derive from name
          type: string
        name:
          examples:
            - go
          type: string
      required:
        - name
      type: object
    Cookie:
      additionalProperties: false
      properties:
        Domain:
          type: string
        Expires:
          format: date-time
          type: string
        HttpOnly:
          type: boolean
        MaxAge:
          format: int64
          type: integer
        Name:
          type: string
        Partitioned:
          type: boolean
        Path:
          type: string
        Quoted:
          type: boolean
        Raw:
          type: string
        RawExpires:
          type: string
        SameSite:
          format: int64
          type: integer
        Secure:
          type: boolean
        Unparsed:
          items:
            type: string
          type:
            - array
            - "null"
        Value:
          type: string
      required:
        - Name
        - Value
        - Quoted
        - Path
        - Domain
        - Expires
        - RawExpires
        - MaxAge
        - Secure
        - HttpOnly
        - SameSite
        - Partitioned
        - Raw
        - Unparsed
      type: object
    CreateInputBody:
      additionalProperties: false
      properties:
        body_markdown:
          maxLength: 200000
          type: string
        canonical_url:
          type: string
        cover_image_url:
          type: string
        subtitle:
          maxLength: 300
          type: string
        tags:
          items:
            type: string
          maxItems: 4
          type:
            - array
            - "null"
        title:
          maxLength: 200
          minLength: 1
          type: string
      required:
        - title
        - body_markdown
      type: object
    DeleteOutputBody:
      additionalProperties: false
      properties:
        status:
          examples:
            - ok
          type: string
      required:
        - status
      type: object
    ErrorBody:
      additionalProperties: false
      properties:
        code:
          description: Stable error code for clients to switch on
          examples:
            - not_found
          type: string
        fields:
          additionalProperties:
            type: string
          description: Per-field errors when code is validation_failed
          type: object
        message:
          description: Human-readable message safe to display
          type: string
      required:
        - code
        - message
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        error:
          $ref: "#/components/schemas/ErrorBody"
      required:
        - error
      type: object
    FeedOutputBody:
      additionalProperties: false
      properties:
        data:
          items:
            $ref: "#/components/schemas/View"
          type: array
        page:
          $ref: "#/components/schemas/PageStruct"
      required:
        - data
        - page
      type: object
    ListOutputBody:
      additionalProperties: false
      properties:
        tags:
          items:
            $ref: "#/components/schemas/Chip"
          type: array
      required:
        - tags
      type: object
    LiveOutputBody:
      additionalProperties: false
      properties:
        status:
          description: Always "ok" while the process is alive
          examples:
            - ok
          type: string
      required:
        - status
      type: object
    MessageOutputBody:
      additionalProperties: false
      properties:
        status:
          examples:
            - ok
          type: string
      required:
        - status
      type: object
    PageStruct:
      additionalProperties: false
      properties:
        has_more:
          type: boolean
        next_cursor:
          type: string
      required:
        - next_cursor
        - has_more
      type: object
    PresignInputBody:
      additionalProperties: false
      properties:
        content_type:
          examples:
            - image/png
          type: string
        size_bytes:
          examples:
            - 482913
          format: int64
          type: integer
      required:
        - content_type
        - size_bytes
      type: object
    PresignOutputBody:
      additionalProperties: false
      properties:
        expires_in:
          description: Seconds the upload URL stays valid
          format: int64
          type: integer
        public_url:
          description: Where the image is served once uploaded
          type: string
        upload_url:
          description: PUT the file here with the same Content-Type
          type: string
      required:
        - upload_url
        - public_url
        - expires_in
      type: object
    ReadyOutputBody:
      additionalProperties: false
      properties:
        checks:
          description: Per-dependency probe results
          items:
            $ref: "#/components/schemas/CheckDTO"
          type: array
        status:
          description: "\"ok\" when every dependency answers"
          examples:
            - ok
          type: string
      required:
        - status
        - checks
      type: object
    SearchHitView:
      additionalProperties: false
      properties:
        headline:
          description: Snippet with matched terms wrapped in <b>
          type: string
        post:
          $ref: "#/components/schemas/View"
      required:
        - post
        - headline
      type: object
    SearchOutputBody:
      additionalProperties: false
      properties:
        data:
          items:
            $ref: "#/components/schemas/SearchHitView"
          type: array
      required:
        - data
      type: object
    SessionResponse:
      additionalProperties: false
      properties:
        access_token:
          description: Short-lived bearer token, kept in memory by the client
          type: string
        expires_in:
          description: Seconds until the access token expires
          format: int64
          type: integer
        token_type:
          examples:
            - Bearer
          type: string
        user:
          $ref: "#/components/schemas/UserView"
      required:
        - access_token
        - token_type
        - expires_in
        - user
      type: object
    StatsView:
      additionalProperties: false
      properties:
        comments:
          format: int64
          type: integer
        reactions:
          format: int64
          type: integer
        views:
          format: int64
          type: integer
      required:
        - reactions
        - comments
        - views
      type: object
    TagView:
      additionalProperties: false
      properties:
        color_key:
          type: string
        name:
          type: string
      required:
        - name
      type: object
    UpdateInputBody:
      additionalProperties: false
      properties:
        body_markdown:
          maxLength: 200000
          type: string
        cover_image_url:
          type: string
        subtitle:
          maxLength: 300
          type: string
        title:
          maxLength: 200
          type: string
      type: object
    UserView:
      additionalProperties: false
      properties:
        avatar_url:
          type: string
        display_name:
          type: string
        id:
          type: string
        username:
          type: string
      required:
        - id
        - username
        - display_name
      type: object
    View:
      additionalProperties: false
      properties:
        author:
          $ref: "#/components/schemas/AuthorView"
        body_html:
          type: string
        body_markdown:
          type: string
        cover_image_url:
          type: string
        excerpt:
          type: string
        id:
          type: string
        published_at:
          type: string
        reading_minutes:
          format: int64
          type: integer
        slug:
          type: string
        stats:
          $ref: "#/components/schemas/StatsView"
        status:
          type: string
        subtitle:
          type: string
        tags:
          items:
            $ref: "#/components/schemas/TagView"
          type: array
        title:
          type: string
        updated_at:
          type: string
        url:
          type: string
      required:
        - id
        - slug
        - url
        - title
        - status
        - reading_minutes
        - tags
        - author
        - stats
        - updated_at
      type: object
  securitySchemes:
    bearer:
      bearerFormat: JWT
      scheme: bearer
      type: http
info:
  description: API for the DevHub technical blogging platform.
  title: DevHub API
  version: 0.1.0
openapi: 3.1.0
paths:
  /api/v1/auth/logout:
    post:
      operationId: logout
      parameters:
        - in: cookie
          name: devhub_refresh
          schema:
            $ref: "#/components/schemas/Cookie"
      responses:
        "204":
          description: No Content
          headers:
            Set-Cookie:
              schema:
                type: string
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Revoke the current session
      tags:
        - auth
  /api/v1/auth/logout-all:
    post:
      operationId: logoutAll
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageOutputBody"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Revoke every session for the current user
      tags:
        - auth
  /api/v1/auth/refresh:
    post:
      operationId: refreshSession
      parameters:
        - in: cookie
          name: devhub_refresh
          schema:
            $ref: "#/components/schemas/Cookie"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
          description: OK
          headers:
            Set-Cookie:
              schema:
                type: string
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Exchange the refresh cookie for a new access token
      tags:
        - auth
  /api/v1/healthz:
    get:
      operationId: getLiveness
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveOutputBody"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Liveness probe
      tags:
        - health
  /api/v1/me/posts:
    get:
      operationId: getMyPosts
      parameters:
        - description: draft, published, or all (default all)
          explode: false
          in: query
          name: status
          schema:
            description: draft, published, or all (default all)
            type: string
        - explode: false
          in: query
          name: limit
          schema:
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardListOutputBody"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: List the current user's posts
      tags:
        - posts
  /api/v1/posts:
    get:
      operationId: listFeed
      parameters:
        - description: latest (default) or hot
          explode: false
          in: query
          name: sort
          schema:
            description: latest (default) or hot
            enum:
              - latest
              - hot
            type: string
        - description: Filter latest by tag name
          explode: false
          in: query
          name: tag
          schema:
            description: Filter latest by tag name
            type: string
        - explode: false
          in: query
          name: cursor
          schema:
            type: string
        - description: Page size (default 20, max 50)
          explode: false
          in: query
          name: limit
          schema:
            description: Page size (default 20, max 50)
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedOutputBody"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List published posts, newest first (cursor paginated)
      tags:
        - posts
    post:
      operationId: createPost
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInputBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/View"
          description: Created
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Create a draft post
      tags:
        - posts
  /api/v1/posts/by-slug/{username}/{slug}:
    get:
      operationId: getPostBySlug
      parameters:
        - in: path
          name: username
          required: true
          schema:
            type: string
        - in: path
          name: slug
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/View"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Get a published post by its public URL
      tags:
        - posts
  /api/v1/posts/{id}:
    delete:
      operationId: deletePost
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteOutputBody"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Delete a post you authored
      tags:
        - posts
    get:
      operationId: getPost
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/View"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Get a post by id (for the editor)
      tags:
        - posts
    patch:
      operationId: updatePost
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/View"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Update a post you authored
      tags:
        - posts
  /api/v1/posts/{id}/publish:
    post:
      operationId: publishPost
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/View"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Publish a draft
      tags:
        - posts
  /api/v1/posts/{id}/unpublish:
    post:
      operationId: unpublishPost
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/View"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Return a post to draft
      tags:
        - posts
  /api/v1/posts/{id}/views:
    post:
      operationId: recordView
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Record a view (buffered, fire-and-forget)
      tags:
        - posts
  /api/v1/readyz:
    get:
      description: Returns 503 with code service_unavailable when a dependency does not answer.
      operationId: getReadiness
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyOutputBody"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Readiness probe
      tags:
        - health
  /api/v1/search:
    get:
      operationId: searchPosts
      parameters:
        - description: Search text, at least 2 characters
          explode: false
          in: query
          name: q
          schema:
            description: Search text, at least 2 characters
            type: string
        - explode: false
          in: query
          name: limit
          schema:
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchOutputBody"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Full-text search over published posts
      tags:
        - posts
  /api/v1/tags:
    get:
      operationId: listTags
      parameters:
        - description: Prefix to autocomplete; empty for popular
          explode: false
          in: query
          name: q
          schema:
            description: Prefix to autocomplete; empty for popular
            type: string
        - description: Max results (default 10, max 50)
          explode: false
          in: query
          name: limit
          schema:
            description: Max results (default 10, max 50)
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListOutputBody"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Autocomplete tags, or list popular tags when q is empty
      tags:
        - tags
  /api/v1/uploads/presign:
    post:
      operationId: presignUpload
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PresignInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresignOutputBody"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Get a presigned URL to upload an image directly to storage
      tags:
        - uploads

