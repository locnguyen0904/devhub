components:
  schemas:
    CheckDTO:
      additionalProperties: false
      properties:
        name:
          description: Dependency name
          examples:
            - postgres
          type: string
        ok:
          description: Whether the dependency answered
          type: boolean
      required:
        - name
        - ok
      type: object
    ErrorBody:
      additionalProperties: false
      properties:
        code:
          description: Stable error code for clients to switch on
          examples:
            - not_found
          type: string
        fields:
          additionalProperties:
            type: string
          description: Per-field errors when code is validation_failed
          type: object
        message:
          description: Human-readable message safe to display
          type: string
      required:
        - code
        - message
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        error:
          $ref: "#/components/schemas/ErrorBody"
      required:
        - error
      type: object
    LiveOutputBody:
      additionalProperties: false
      properties:
        status:
          description: Always "ok" while the process is alive
          examples:
            - ok
          type: string
      required:
        - status
      type: object
    ReadyOutputBody:
      additionalProperties: false
      properties:
        checks:
          description: Per-dependency probe results
          items:
            $ref: "#/components/schemas/CheckDTO"
          type: array
        status:
          description: "\"ok\" when every dependency answers"
          examples:
            - ok
          type: string
      required:
        - status
        - checks
      type: object
info:
  description: API for the DevHub technical blogging platform.
  title: DevHub API
  version: 0.1.0
openapi: 3.1.0
paths:
  /api/v1/healthz:
    get:
      operationId: getLiveness
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveOutputBody"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Liveness probe
      tags:
        - health
  /api/v1/readyz:
    get:
      description: Returns 503 with code service_unavailable when a dependency does not answer.
      operationId: getReadiness
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyOutputBody"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Readiness probe
      tags:
        - health

