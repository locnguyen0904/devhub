version: "2"
sql:
  - engine: postgresql
    schema: db/migrations
    queries: db/queries
    gen:
      go:
        package: sqlcgen
        out: internal/platform/database/sqlcgen
        sql_package: pgx/v5
        # Nullable columns become pointers instead of pgtype wrappers, so the
        # repository can map them to domain models without unwrapping ceremony.
        emit_pointers_for_null_types: true
        emit_json_tags: false
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: timestamptz
            go_type: time.Time
