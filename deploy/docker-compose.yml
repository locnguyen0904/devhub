name: devhub

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: devhub
      POSTGRES_PASSWORD: devhub
      POSTGRES_DB: devhub
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devhub -d devhub"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Object storage for post images. S3-compatible, so production can swap to
  # Cloudflare R2 / AWS S3 by changing env vars only.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: devhub
      MINIO_ROOT_PASSWORD: devhub123
      # Allow the browser to PUT presigned uploads from the frontend origin.
      # Dev-only; production storage sets its own CORS.
      MINIO_API_CORS_ALLOW_ORIGIN: "http://localhost:5173,http://localhost:5174"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot init: create the bucket and make its objects publicly readable so
  # <img src> works without signing every GET. Runs after MinIO is healthy.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 devhub devhub123 &&
      mc mb --ignore-existing local/devhub &&
      mc anonymous set download local/devhub
      "

volumes:
  postgres-data:
  redis-data:
  minio-data:
