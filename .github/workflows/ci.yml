name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push supersedes the previous run on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.24"
  NODE_VERSION: "22"

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      # golangci-lint is pinned in go.mod as a tool dependency rather than
      # installed by an action, so CI and dev machines cannot drift. The first
      # run compiles it; the Go build cache makes later runs fast.
      - name: Lint
        run: make lint

      - name: Test
        run: make test

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # Fails if any design token pair drops below WCAG AA. Keeps
      # docs/06-design-system.md §9 true instead of merely written down.
      - name: Contrast
        run: pnpm contrast

      - name: Build
        run: pnpm build

  openapi-sync:
    name: OpenAPI in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      # The spec is generated from Go structs, so a changed handler that was not
      # regenerated shows up here rather than as a runtime type mismatch weeks
      # later. Generating needs no live database: the subcommand never dials.
      - name: Regenerate and compare
        run: |
          make openapi
          git diff --exit-code -- docs/openapi.yaml frontend/src/shared/types/api.ts \
            || { echo "::error::Run 'make openapi' and commit the generated files."; exit 1; }
